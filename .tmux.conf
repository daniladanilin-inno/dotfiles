# NOTE: SETS
set -g prefix C-Space
# set -g prefix2 C-b
unbind C-b
bind C-Space send-prefix

set -g mouse on
set -g status on
set -g base-index 1
setw -g mode-keys vi
set -s escape-time 0
set -g repeat-time 500
set -g status-keys vi
set -s set-clipboard on
set -g status-interval 5
set -g status-position bottom
# Leave default-shell unset: tmux will use the user's login shell. This works
# on minimal Ubuntu installations where zsh may not be installed.
set -g window-status-format " "
set -g window-status-separator ""
# Status line colour is set by ssh-status.sh (cyan locally, orange over ssh); see the hooks
# near the bottom of this file. This line is just the pre-hook default.
set -g status-style fg=cyan,bold
set -g status-left ">_ #{session_name}"
# Default is 10, which chopped ">_ github-…" mid-word.
set -g status-left-length 40
set -g window-status-current-format " "
# Truecolor: tmux-256color advertises 256 colors + the RGB feature tells tmux the OUTER
# terminal (Ghostty) speaks 24-bit, so hex colors (nvim themes, eza, autosuggest fg=#555)
# pass through instead of being quantized to the nearest palette slot.
# Keep this before all key bindings so applications inherit it consistently.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# Fallback for tmux < 3.2, which has no terminal-features:
set -as terminal-overrides ",*256col*:Tc"
# tmux runs the status strings through strftime(3), so the clock needs no `date`
# call at all -- and any literal percent sign below must be written as %%.
DATE="%I:%M %p"
# Portable battery %: macOS pmset, else Linux sysfs. Prints nothing on a machine with no battery
# (VMs, containers, desktops) instead of erroring out.
#
# Branch on `command -v pmset` rather than chaining the two with `||`. A pipeline's exit status is
# its LAST command's, and `head -1` succeeds on empty input, so `pmset ... | head -1` returned 0
# even on Linux where pmset does not exist -- the fallback never ran and the battery was simply
# blank there.
#
# Single-quoted, and the awk field is written \$1, so tmux does not expand it as a variable.
# NOTE: "%%" below reaches the shell as "%". Written as a single "%", strftime eats it, the
# pattern becomes [0-9]+ and the first match is the 0 in "-InternalBattery-0" rather than the
# charge level.
BATTERY='#(if command -v pmset >/dev/null 2>&1; then pmset -g batt | grep -Eo "[0-9]+%%" | head -1; else awk "{print \$1 \"%%\"}" /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1; fi)'
set -g status-right "#[align=absolute-centre]$DATE#[align=right]$BATTERY"
set -g status-right-length 60


# NOTE: SSH ENVIRONMENT HYGIENE
# tmux copies a fixed list of variables from the attaching client into the session environment,
# updating them on every attach and REMOVING the ones the client does not have. That list
# (update-environment) contains SSH_CONNECTION but NOT SSH_CLIENT or SSH_TTY.
#
# The consequence: whichever shell first started the tmux server -- typically an ssh login --
# leaves SSH_CLIENT and SSH_TTY in the server's GLOBAL environment, where nothing ever clears
# them. Every pane created afterwards inherits them, including panes opened from a local
# terminal, and the zsh prompt then paints itself remote-orange on a local machine.
#
# Fix both halves: track all three variables so they follow the attaching client, and drop any
# copies the server captured at startup.
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_CLIENT SSH_TTY WINDOWID XAUTHORITY"
set-environment -gu SSH_CLIENT
set-environment -gu SSH_CONNECTION
set-environment -gu SSH_TTY

# NOTE: BINDS  (prefix = Ctrl-Space; "prefix X" means: hit prefix, release, then X)

# prefix c  -> kill current pane (overrides default "new window"; new-window is on prefix a below).
bind c killp
# prefix r  -> reload this file and flash a confirmation in the status bar.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
# prefix %  -> vertical split, inheriting the current pane's working directory.
bind % split-window -h -c "#{pane_current_path}"
# prefix "  -> horizontal split, inheriting the current pane's working directory.
bind '"' split-window -v -c "#{pane_current_path}"
# prefix a  -> new window, then prompt for its name.
bind a new-window\; command-prompt -p "Enter window name:" 'rename-window %1'
# prefix g  -> floating lazygit (90% screen) in the current pane's directory.
bind g display-popup -E -h 90% -w 90% -d "#{pane_current_path}" "lazygit"
# prefix ~  -> floating scratch shell (60% screen) in the current pane's directory.
bind '~' display-popup -E -h 60% -w 60% -d "#{pane_current_path}"


# set -s allow-passthrough on

# ----- Copy mode (vi-style selection) -----
# v  -> start a character-wise selection (like Visual mode in vim).
bind -T copy-mode-vi v send-keys -X begin-selection
# Y  -> copy from cursor to end of line.
bind -T copy-mode-vi Y send-keys -X copy-end-of-line
# y / mouse-drag -> copy to the native clipboard (macOS, Wayland, or X11).
# Install wl-clipboard, xclip, or xsel on Ubuntu for system clipboard support.
set -g @copy_command 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -in -selection clipboard; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; else cat >/dev/null; fi'
bind -T copy-mode-vi y send-keys -X copy-pipe-no-clear "#{@copy_command}"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "#{@copy_command}"

# ----- Pane navigation (prefix + hjkl, repeatable for repeat-time ms) -----
bind -r ^ last-window       # prefix ^  -> toggle between current and previous window
bind -r k select-pane -U    # prefix k  -> focus pane above
bind -r j select-pane -D    # prefix j  -> focus pane below
bind -r h select-pane -L    # prefix h  -> focus pane left
bind -r l select-pane -R    # prefix l  -> focus pane right

# ----- Session jump: Alt+1..9 (Ghostty maps Cmd+1..9 to ESC+digit = M-digit) -----
# Each M-N attaches/creates session #N via the tmux_sessions helper.
bind-key -n M-1 run-shell "tmux_sessions a 1 2> /dev/null"
bind-key -n M-2 run-shell "tmux_sessions a 2 2> /dev/null"
bind-key -n M-3 run-shell "tmux_sessions a 3 2> /dev/null"
bind-key -n M-4 run-shell "tmux_sessions a 4 2> /dev/null"
bind-key -n M-5 run-shell "tmux_sessions a 5 2> /dev/null"
bind-key -n M-6 run-shell "tmux_sessions a 6 2> /dev/null"
bind-key -n M-7 run-shell "tmux_sessions a 7 2> /dev/null"
bind-key -n M-8 run-shell "tmux_sessions a 8 2> /dev/null"
bind-key -n M-9 run-shell "tmux_sessions a 9 2> /dev/null"

# ----- Session pickers -----
# C-l stays unbound so zsh keeps clear-screen.
unbind-key -n C-l
# Ctrl-j  -> fzf picker over OTHER sessions, with a preview of their windows + last 6 lines.
bind-key -n C-j display-popup -h 90% -w 90% -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --preview 'echo -e $(tmux list-windows -F "\""#I: #W#F |"\"" -t {});tmux capturep -t {} -S 6 -e -p' | xargs -r -d '\\n' -I S tmux switch-client -t S"
# Ctrl-k  -> custom fuzzy picker via the tmux_sessions helper (mode "f").
bind-key -n C-k display-popup -h 90% -w 90% -E "tmux_sessions f"
# Rebind C-j with a POSIX shell loop (BSD xargs lacks GNU's -d/-r flags).
bind-key -n C-j display-popup -h 90% -w 90% -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --preview 'tmux capturep -ep -t {}' | while IFS= read -r S; do [ -n \"$S\" ] && tmux switch-client -t \"=$S\"; done"
# Ctrl-s  -> fzf popup over ALL sessions: enter switches, ctrl-x kills marked, ctrl-a kills all others.
bind-key -n C-s display-popup -h 90% -w 90% -E "~/.config/tmux/session-picker.sh"
# Alt-Shift-n  -> prompt for a new session name, then attach/create it.
bind-key -n M-N command-prompt -p "Enter session name: " "run-shell 'tmux_sessions a %1'"

# NOTE: NESTED TMUX  (outer <-> inner passthrough)
# Every binding above made with `-n` / `-T root` -- C-s, C-j, C-k, M-1..M-9, M-N -- is claimed by
# the OUTER tmux before an inner one (e.g. the tmux waiting at the far end of an ssh hop) can ever
# see it. F12 parks this tmux: prefix off, root table off, status bar greyed and labelled, so the
# identical keys drive the inner session instead. F12 again takes control back.
#
# Scope matters here: prefix / key-table / status-* are set WITHOUT -g so that `set -u` restores
# the global values underneath -- `set -ug prefix` would reset to C-b, not C-Space, and would also
# clobber the colour ssh-status.sh maintains.
bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=colour245,bg=colour236" \;\
    set status-left ">_ #{session_name} -- OUTER PARKED (F12) " \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    set -u status-left \;\
    run-shell -b "~/.config/tmux/ssh-status.sh" \;\
    refresh-client -S

# NOTE: SSH STATUS COLOUR
# Repaint the status line whenever the set of attached clients changes: orange while anyone is
# viewing this server over ssh, cyan when it is all local. Mirrors the prompt override in ~/.zshrc.
set-hook -g client-attached        'run-shell -b "~/.config/tmux/ssh-status.sh"'
set-hook -g client-detached        'run-shell -b "~/.config/tmux/ssh-status.sh"'
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/ssh-status.sh"'
# Also run once at config load, so `prefix r` and a fresh server both get the right colour.
run-shell -b "~/.config/tmux/ssh-status.sh"

# NOTE: MACHINE-LOCAL
# Per-machine tmux settings (tpm + plugins on the mac, anything host-specific) live here.
# -q so it is silently skipped on a machine that has no local.conf.
source-file -q ~/.config/tmux/local.conf
